<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>НЮАНС — Корпоративные подарки</title>
 
<style>
* {
    box-sizing: border-box;
}
 
html, body {
    margin: 0;
    padding: 0;
    background: #000;
}
 
.page {
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
}
 
.page img {
    display: block;
    width: 100%;
    height: auto;
}
 
/* Нижняя панель контактов */
.contacts {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.92);
}
 
.contacts a {
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 13px 22px;
    border-radius: 30px;
    text-align: center;
}
 
.phone {
    background: white;
    color: black;
}
 
.max {
    background: #222;
    color: white;
    border: 1px solid #555;
}
 
@media (max-width: 600px) {
    .contacts a {
        font-size: 14px;
        padding: 12px 15px;
    }
}
</style>
</head>
 
<body>
 
<div class="page">
    <img src="catalog.png" alt="Корпоративные подарки НЮАНС">
</div>
 
<div class="contacts">
 
    <a class="phone" href="tel:+79279273017">
        📞 8 927 927-30-17
    </a>
 
    <a class="max"
       href="https://max.ru/u/f9LHodD0cOJAh6hT-1g0yL3hMohWoVAVd7f1r31bB9WYpWVxfl_U1mQvJiU"
       target="_blank">
        💬 Написать в MAX
    </a>
 
</div>
 
</body>
</html>
